services:
  - type: web
    name: noor-ul-quran-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: RENDER_MEMORY_PROFILE
        value: low
      - key: OUTPUT_DIR
        value: /tmp/noor/output
      - key: CACHE_DIR
        value: /tmp/noor/cache
      - key: SUPABASE_BACKGROUNDS_BUCKET
        value: backgrounds
      - key: SUPABASE_MEDIA_BUCKET
        value: noor-media
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: VIDEO_URL_SECRET
        generateValue: true
