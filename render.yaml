services:
  - type: web
    name: noor-ul-quran-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_MEDIA_BUCKET
        value: noor-media
      - key: FRONTEND_ORIGINS
        sync: false
      - key: OUTPUT_DIR
        value: /tmp/noor/output
      - key: BACKGROUNDS_DIR
        value: /tmp/noor/backgrounds
      - key: CACHE_DIR
        value: /tmp/noor/cache
