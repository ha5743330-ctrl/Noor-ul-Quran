<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f2f6f3">
    <meta name="description" content="Search the Quran in Arabic, Urdu or English and jump to a reel.">
    <title>Search Ayat | Noor ul Quran</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/ui.css?v=11">
</head>
<body class="ui-page ui-search">
    <a class="skip-link" href="#main">Skip to content</a>
    <header id="site-header"></header>

    <main id="main" class="page-wrap">
        <h1 class="page-title">Search Ayat</h1>
        <p class="page-sub">Arabic, Urdu ya English likhein (ya 2:255 jaisa reference). Sirf text search, tafseer quran.com par.</p>

        <form id="sr-form" class="ui-card pf-card" role="search">
            <label for="sr-q" class="hint">Search text</label>
            <div class="sr-row">
                <input id="sr-q" name="q" type="search" class="control" minlength="2" maxlength="100" autocomplete="off" required placeholder="e.g. patience, صبر, الحي القيوم">
                <button type="submit" class="btn btn-primary">Search</button>
            </div>
        </form>

        <p id="sr-status" class="ui-state" data-kind="empty" role="status" aria-live="polite">Type at least 2 letters and press Search.</p>
        <ul id="sr-list" class="sr-list"></ul>
    </main>

    <footer class="page-wrap" style="padding-top:0;text-align:center">
        <a href="/privacy.html">Privacy</a> · <a href="/terms.html">Terms</a>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
    <script src="/config.js"></script>
    <script src="/auth.js?v=9"></script>
    <script src="/nav.js?v=4"></script>
    <script src="/search.js?v=1"></script>
</body>
</html>
