<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noor ul Quran – Account Authentication</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/config.js" defer></script>
    <!-- Updated JS with Cache-Buster Version -->
    <script src="auth.js?v=7" defer></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-slate-900">

    <!-- Top Navigation Bar -->
    <header class="h-20 border-b border-slate-800/80 px-6 flex items-center justify-between">
        <a href="index.html" class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-yellow-300 flex items-center justify-center text-slate-950 font-bold text-lg shadow-lg shadow-amber-500/20">
                <i class="fa-solid fa-quran"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg bg-gradient-to-r from-amber-300 to-yellow-500 bg-clip-text text-transparent">Noor ul Quran</h1>
                <p class="text-[10px] text-slate-400 font-medium">Auto Quran Reel Generator</p>
            </div>
        </a>
        <a href="index.html" class="text-xs text-slate-400 hover:text-white transition-colors flex items-center gap-2 bg-slate-900 px-4 py-2 rounded-xl border border-slate-800">
            <i class="fa-solid fa-arrow-left"></i> Back to Studio
        </a>
    </header>

    <!-- Authentication Card Container -->
    <main class="my-12 px-4 max-w-md mx-auto w-full">
        <div class="glass-card rounded-3xl p-8 border border-slate-800 shadow-2xl space-y-6">

            <!-- Logo Header -->
            <div class="text-center space-y-2">
                <h2 id="auth-title" class="text-2xl font-bold text-slate-100">Welcome Back</h2>
                <p id="auth-subtitle" class="text-xs text-slate-400">Sign in to access your Quran Reel Studio account</p>
            </div>

            <!-- Tab Switcher (Login vs Sign Up) -->
            <div class="grid grid-cols-2 gap-1 p-1 bg-slate-900 rounded-xl border border-slate-800 text-center font-medium text-xs">
                <button id="tab-login" type="button" onclick="switchAuthTab('login')" class="py-2.5 rounded-lg bg-slate-800 text-amber-400 font-semibold shadow-sm transition-all">
                    Sign In
                </button>
                <button id="tab-signup" type="button" onclick="switchAuthTab('signup')" class="py-2.5 rounded-lg text-slate-400 hover:text-slate-200 transition-all">
                    Create Account
                </button>
            </div>

            <!-- Status Alert Box -->
            <div id="auth-alert" class="hidden p-3 rounded-xl text-xs font-medium border"></div>
            <button id="btn-resend-confirmation" type="button" onclick="resendConfirmationEmail()" class="hidden text-sm font-semibold text-amber-400 hover:text-amber-300">
                Resend confirmation email
            </button>

            <!-- Login Form -->
            <form id="form-login" onsubmit="handleSignIn(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5">Email Address</label>
                    <div class="relative">
                        <i class="fa-solid fa-envelope absolute left-3.5 top-3.5 text-slate-500 text-sm"></i>
                        <input type="email" id="login-email" required placeholder="name@example.com" class="w-full bg-slate-900 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-amber-500 transition-colors">
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="block text-xs font-medium text-slate-300">Password</label>
                        <a href="#" onclick="handlePasswordReset()" class="text-[11px] text-amber-400 hover:underline">Forgot password?</a>
                    </div>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-500 text-sm"></i>
                        <input type="password" id="login-password" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-amber-500 transition-colors">
                    </div>
                </div>

                <div class="flex items-center gap-2 pt-1">
                    <input type="checkbox" id="remember" class="accent-amber-500 rounded border-slate-800">
                    <label for="remember" class="text-xs text-slate-400">Remember me on this device</label>
                </div>

                <button type="submit" id="btn-login" class="w-full bg-gradient-to-r from-amber-500 to-yellow-500 text-slate-950 font-bold py-3 rounded-xl text-sm hover:shadow-lg hover:shadow-amber-500/20 active:scale-[0.99] transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i> Sign In
                </button>
            </form>

            <!-- Sign Up Form (Hidden by Default) -->
            <form id="form-signup" onsubmit="handleSignUp(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5">Full Name</label>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-3.5 top-3.5 text-slate-500 text-sm"></i>
                        <input type="text" id="signup-name" required placeholder="Haider Ali" class="w-full bg-slate-900 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-amber-500 transition-colors">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5">Email Address</label>
                    <div class="relative">
                        <i class="fa-solid fa-envelope absolute left-3.5 top-3.5 text-slate-500 text-sm"></i>
                        <input type="email" id="signup-email" required placeholder="name@example.com" class="w-full bg-slate-900 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-amber-500 transition-colors">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5">Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-500 text-sm"></i>
                        <input type="password" id="signup-password" minlength="6" required placeholder="At least 6 characters" class="w-full bg-slate-900 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-amber-500 transition-colors">
                    </div>
                </div>

                <div class="flex items-center gap-2 pt-1">
                    <input type="checkbox" required id="terms" class="accent-amber-500 rounded border-slate-800">
                    <label for="terms" class="text-xs text-slate-400">I agree to the <a href="#" class="text-amber-400 hover:underline">Terms & Privacy Policy</a></label>
                </div>

                <button type="submit" id="btn-signup" class="w-full bg-gradient-to-r from-amber-500 to-yellow-500 text-slate-950 font-bold py-3 rounded-xl text-sm hover:shadow-lg hover:shadow-amber-500/20 active:scale-[0.99] transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-user-plus"></i> Create Free Account
                </button>
            </form>

            <!-- Social Divider -->
            <div class="relative flex py-2 items-center">
                <div class="flex-grow border-t border-slate-800"></div>
                <span class="flex-shrink mx-4 text-[11px] text-slate-500">OR CONTINUE WITH</span>
                <div class="flex-grow border-t border-slate-800"></div>
            </div>

            <!-- Social Logins -->
            <div class="grid grid-cols-2 gap-3">
                <button type="button" onclick="handleSocialAuth('google')" class="flex items-center justify-center gap-2 bg-slate-900 hover:bg-slate-800/80 border border-slate-800 py-2.5 rounded-xl text-xs font-medium text-slate-300 transition-colors">
                    <i class="fa-brands fa-google text-rose-500"></i> Google
                </button>
                <button type="button" onclick="handleSocialAuth('github')" class="flex items-center justify-center gap-2 bg-slate-900 hover:bg-slate-800/80 border border-slate-800 py-2.5 rounded-xl text-xs font-medium text-slate-300 transition-colors">
                    <i class="fa-brands fa-github text-slate-100"></i> GitHub
                </button>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800/80 py-6 text-center text-xs text-slate-500">
        <p>© 2026 Noor ul Quran Auto Reel Maker. All rights reserved.</p>
    </footer>

    <!-- Tab Switcher Script -->
    <script>
        function switchAuthTab(type) {
            const loginForm = document.getElementById('form-login');
            const signupForm = document.getElementById('form-signup');
            const tabLogin = document.getElementById('tab-login');
            const tabSignup = document.getElementById('tab-signup');
            const title = document.getElementById('auth-title');
            const subtitle = document.getElementById('auth-subtitle');
            const alertBox = document.getElementById('auth-alert');

            if (alertBox) alertBox.classList.add('hidden');

            if (type === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                tabLogin.className = "py-2.5 rounded-lg bg-slate-800 text-amber-400 font-semibold shadow-sm transition-all";
                tabSignup.className = "py-2.5 rounded-lg text-slate-400 hover:text-slate-200 transition-all";
                title.innerText = "Welcome Back";
                subtitle.innerText = "Sign in to access your Quran Reel Studio account";
            } else {
                signupForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
                tabSignup.className = "py-2.5 rounded-lg bg-slate-800 text-amber-400 font-semibold shadow-sm transition-all";
                tabLogin.className = "py-2.5 rounded-lg text-slate-400 hover:text-slate-200 transition-all";
                title.innerText = "Create Account";
                subtitle.innerText = "Get started with automated Quran Reel generation";
            }
        }
    </script>
</body>
</html>
