<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="light dark">
    <script>try{var t=localStorage.getItem("noor-theme")}catch(e){}document.documentElement.dataset.theme=t==="dark"||t==="light"?t:matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f6f1e7">
    <title>Library | Noor ul Quran</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="preload" href="/fonts/AmiriQuran-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/ui.css?v=16">
</head>
<body class="ui-page ui-library">
    <a class="skip-link" href="#main">Skip to content</a>
    <header id="site-header"></header>

    <main id="main" class="page-wrap">
        <h1 class="page-title">Library</h1>
        <p class="page-sub">Aap ki saari videos aur ayah images, naye pehle.</p>

        <section class="ui-card pf-card" aria-label="Your videos and images">
            <div class="lib-toolbar">
                <div class="lib-tabs" role="group" aria-label="Filter">
                    <button type="button" data-filter="all" aria-pressed="true">All</button>
                    <button type="button" data-filter="video" aria-pressed="false">Videos</button>
                    <button type="button" data-filter="image" aria-pressed="false">Images</button>
                </div>
                <button id="lib-select-toggle" type="button" class="btn btn-outline btn-sm">Select</button>
                <div id="lib-bulk" class="lib-bulk">
                    <label class="lib-check"><input id="lib-select-all" type="checkbox">Select all</label>
                    <span id="lib-count" aria-live="polite">0 selected</span>
                    <button id="lib-download" type="button" class="btn btn-primary btn-sm" disabled>Download selected</button>
                    <button id="lib-delete" type="button" class="btn btn-danger-outline btn-sm" disabled>Delete selected</button>
                    <button id="lib-cancel" type="button" class="btn btn-outline btn-sm">Cancel</button>
                </div>
            </div>
            <p id="lib-status" class="pf-msg" role="status" aria-live="polite"></p>
            <div id="lib-skel"></div>
            <div id="lib-empty" class="lib-empty" hidden></div>
            <ul id="lib-list" class="lib-grid"></ul>
            <button id="lib-more" type="button" class="btn btn-outline btn-sm load-more" hidden>Load more</button>
        </section>
    </main>

    <footer class="page-wrap" style="padding-top:0;text-align:center">
        <a href="/privacy.html">Privacy</a> · <a href="/terms.html">Terms</a>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
    <script src="/config.js"></script>
    <script src="/ui-states.js?v=1"></script>
    <script src="/auth.js?v=10"></script>
    <script src="/nav.js?v=5"></script>
    <script src="/library.js?v=4"></script>
</body>
</html>
