<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f2f6f3">
    <title>Noor ul Quran – Reset Password</title>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
    <script src="/config.js"></script>
    <script src="/auth.js?v=9"></script>
    <link rel="stylesheet" href="/ui.css">
</head>
<body class="ui-page ui-auth min-h-screen flex flex-col justify-between selection:bg-emerald-100">
    <header class="h-20 border-b border-slate-800/80 px-6 flex items-center">
        <a href="/" class="font-bold text-lg bg-gradient-to-r from-amber-300 to-yellow-500 bg-clip-text text-transparent">Noor ul Quran</a>
    </header>
    <main class="my-12 px-4 max-w-md mx-auto w-full">
        <div class="glass-card rounded-3xl p-8 border border-slate-800 shadow-2xl space-y-6">
            <div class="text-center space-y-2">
                <h1 class="text-2xl font-bold text-slate-100">Naya password banayein</h1>
                <p class="text-xs text-slate-400">Set a new password for your account</p>
            </div>
            <div id="reset-alert" role="status" class="p-3 rounded-xl text-xs font-medium border bg-slate-500/10 text-slate-300 border-slate-500/20">Link check ho raha hai... Checking your reset link...</div>
            <form id="reset-form" class="space-y-4 hidden" novalidate>
                <div>
                    <label for="new-password" class="block text-xs font-medium text-slate-300 mb-1.5">New password (min 8 characters)</label>
                    <input type="password" id="new-password" autocomplete="new-password" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label for="confirm-password" class="block text-xs font-medium text-slate-300 mb-1.5">Confirm password</label>
                    <input type="password" id="confirm-password" autocomplete="new-password" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
                </div>
                <label class="flex items-center gap-2 text-xs text-slate-400"><input type="checkbox" id="show-password" class="accent-amber-500"> Show passwords</label>
                <button type="submit" id="reset-submit" class="w-full bg-gradient-to-r from-amber-500 to-yellow-500 text-slate-950 font-bold py-3 rounded-xl text-sm disabled:opacity-60">Update password</button>
            </form>
            <a id="request-again" href="/auth.html?forgot=1" class="hidden text-center text-sm font-semibold text-amber-400 hover:underline">Naya reset link mangwayein / Request a new link</a>
        </div>
    </main>
    <footer class="border-t border-slate-800/80 py-6 text-center text-xs text-slate-500">
        <a href="/privacy.html" class="hover:text-amber-400">Privacy</a>
        <span class="mx-2" aria-hidden="true">·</span>
        <a href="/terms.html" class="hover:text-amber-400">Terms</a>
    </footer>
    <script>
        const alertBox = document.getElementById("reset-alert");
        const form = document.getElementById("reset-form");
        function say(message, kind) {
            alertBox.textContent = message;
            alertBox.className = "p-3 rounded-xl text-xs font-medium border " + (kind === "ok"
                ? "bg-emerald-500/10 text-emerald-400 border-emerald-500/20"
                : kind === "error" ? "bg-red-500/10 text-red-400 border-red-500/20"
                : "bg-slate-500/10 text-slate-300 border-slate-500/20");
        }
        function invalidLink() {
            form.classList.add("hidden");
            const again = document.getElementById("request-again");
            again.classList.remove("hidden");
            again.classList.add("block");
            say("Yeh link expire ho gaya ya ghalat hai. This reset link is invalid or has expired.", "error");
        }
        let recovered = false;
        if (/error/.test(location.hash) || !window.supabaseClient) {
            invalidLink();
        } else {
            window.supabaseClient.auth.onAuthStateChange((event) => {
                if (event !== "PASSWORD_RECOVERY") return;
                recovered = true;
                form.classList.remove("hidden");
                say("Apna naya password likhein. Enter your new password.", "info");
            });
            setTimeout(() => { if (!recovered) invalidLink(); }, 3000);
        }
        document.getElementById("show-password").addEventListener("change", (e) => {
            for (const id of ["new-password", "confirm-password"]) {
                document.getElementById(id).type = e.target.checked ? "text" : "password";
            }
        });
        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            const password = document.getElementById("new-password").value;
            if (password.length < 8) return say("Password kam az kam 8 characters ka ho. Minimum 8 characters.", "error");
            if (password !== document.getElementById("confirm-password").value) return say("Passwords match nahi karte. Passwords do not match.", "error");
            const button = document.getElementById("reset-submit");
            button.disabled = true;
            const { error } = await window.supabaseClient.auth.updateUser({ password });
            if (error) {
                button.disabled = false;
                return say(error.message || "Could not update password.", "error");
            }
            form.classList.add("hidden");
            say("Password update ho gaya. Password updated. Login page par ja rahe hain...", "ok");
            await window.supabaseClient.auth.signOut();
            setTimeout(() => location.replace("/auth.html"), 2000);
        });
    </script>
</body>
</html>
