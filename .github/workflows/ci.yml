name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m py_compile main.py make.py
      - run: python -m pytest
      - name: Check frontend JavaScript
        run: for file in public/*.js; do node --check "$file"; done

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t noor-ul-quran .
